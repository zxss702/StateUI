# The core's suites on macOS - the library, the host layer and the conformance
# runner - and the Gallery's, with the starter application built, since no
# suite compiles it. Each host's own suite runs in a workflow of its own.

name: Core macOS

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  swiftomniui:
    name: SwiftOmniUI
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test SwiftOmniUI
        run: swift test --filter SwiftOmniUITests
      - name: Test SwiftOmniUI.Host
        run: swift test --filter SwiftOmniUIHostTests
      - name: Foundation bridge tests
        run: swift test --filter SwiftOmniUIFoundationTests
      - name: JsonData bridge tests
        run: swift test --filter SwiftOmniUIJsonDataTests
      # The conformance runner's own rules and every contract's family complete,
      # pure Swift: no host runs here, so no verdict is read or written.
      - name: Test SwiftOmniUI.Conformance
        run: swift test --filter SwiftOmniUIConformanceTests

  gallery:
    name: Gallery
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test Gallery
        run: swift test --package-path apps/Gallery
      - name: Build HelloWorld
        run: swift build --package-path apps/HelloWorld
